name: CI Check

on:
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Verify admin-frontend and website
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify admin-frontend
        run: pnpm verify
        working-directory: admin-frontend

      - name: Verify website
        run: pnpm verify
        working-directory: website
