name: Manual Release Build

on:
  workflow_dispatch: # Strictly manual trigger from the GitHub UI

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release and upload assets

    defaults:
      run:
        working-directory: ./frontend/android

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install packages
      working-directory: ./frontend
      run: npm install

    - name: Workaround Metro monorepo root resolution
      run: ln -s frontend/node_modules node_modules
      working-directory: ${{ github.workspace }}

    - name: Run Expo Prebuild
      working-directory: ./frontend
      run: npx expo prebuild --platform android

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin' # Temurin environment
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4 # Handles automated caching for faster builds

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      run: echo "${{ secrets.MY_KEYSTORE_BASE64 }}" | base64 --decode > app/mentivo.keystore

    - name: Inject Secrets into gradle.properties
      run: |
        # Replace the placeholders in gradle.properties with actual GitHub Secrets
        sed -i 's|^RELEASE_KEY_PASSWORD=.*|RELEASE_KEY_PASSWORD=${{ secrets.MY_KEY_PASSWORD }}|' gradle.properties
        sed -i 's|^RELEASE_STORE_PASSWORD=.*|RELEASE_STORE_PASSWORD=${{ secrets.MY_STORE_PASSWORD }}|' gradle.properties
        
        # Verify the injection worked without exposing the actual passwords in the logs
        echo "=== Verifying gradle.properties signing configuration (Masked) ==="
        cat gradle.properties | grep -E "RELEASE_STORE_FILE|RELEASE_KEY_ALIAS|RELEASE_KEY_PASSWORD|RELEASE_STORE_PASSWORD" | sed 's/PASSWORD=.*/PASSWORD=******/'

    - name: Build Release Binary and Bundle
      run: ./gradlew bundleRelease

    - name: Generate Release Tag
      id: tag
      working-directory: ${{ github.workspace }}
      run: echo "release_tag=v${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Create Release and Upload Binaries
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: Release ${{ steps.tag.outputs.release_tag }}
        draft: false
        prerelease: false
        files: |
          frontend/android/**/build/outputs/**/*.apk
          frontend/android/**/build/outputs/**/*.aab